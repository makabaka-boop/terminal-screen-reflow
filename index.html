<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas Terminal Replay</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0c0f;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
      }
      main {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        height: 100vh;
        gap: 8px;
        padding: 8px;
        box-sizing: border-box;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #101216;
      }
      .controls {
        display: flex;
        gap: 8px;
      }
      input[type='range'] {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="terminal"></canvas>
      <div class="controls">
        <button id="play" type="button">播放</button>
        <input id="trace" type="file" />
        <label>列 <input id="cols" type="number" min="2" value="80" /></label>
        <input id="position" type="range" min="0" value="0" />
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
